name: pettyclaim_mobile
description: "PettyClaim Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.3.1
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.16.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  http: ^1.2.1
  http_parser: ^4.0.2
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  intl: 0.20.2
  image_picker: ^1.1.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_pettyclaim.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo_pettyclaim.png"
    background_color: "#070B14"
    theme_color: "#0F2C59"
  windows:
    generate: true
    image_path: "assets/logo_pettyclaim.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/logo_pettyclaim.png